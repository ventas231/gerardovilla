# Publica encuesta.gerardovilla.mx en GitHub Pages cada vez que se fusiona un cambio a main.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # vite.config.ts genera las páginas como HTML estático en dist/client.
      - run: npx vite build
      - run: cp dist/client/index.html dist/client/404.html && touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deploy
        uses: actions/deploy-pages@v4
